<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="url(#bg)" rx="16"/>

  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Terraform Multi-Environment Architecture</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">shared modules → thin environment stacks → remote state with locking</text>

  <!-- Shared modules -->
  <g>
    <rect x="60" y="100" width="780" height="120" rx="12" fill="#1e293b" stroke="#7B42BC" stroke-width="2"/>
    <text x="80" y="126" fill="#c4b5fd" font-size="14" font-weight="700">Shared Modules (modules/) — the only real infra code</text>
    <g font-size="12" fill="#e2e8f0">
      <rect x="90" y="140" width="220" height="60" rx="8" fill="#312e81" stroke="#7B42BC"/>
      <text x="200" y="164" text-anchor="middle" font-weight="600">vpc</text>
      <text x="200" y="182" text-anchor="middle" fill="#a5b4fc">subnets · NAT · routes</text>
      <rect x="340" y="140" width="220" height="60" rx="8" fill="#312e81" stroke="#7B42BC"/>
      <text x="450" y="164" text-anchor="middle" font-weight="600">compute</text>
      <text x="450" y="182" text-anchor="middle" fill="#a5b4fc">ASG · ALB · launch tmpl</text>
      <rect x="590" y="140" width="220" height="60" rx="8" fill="#312e81" stroke="#7B42BC"/>
      <text x="700" y="164" text-anchor="middle" font-weight="600">database</text>
      <text x="700" y="182" text-anchor="middle" fill="#a5b4fc">RDS · backups · params</text>
    </g>
  </g>

  <!-- Environments -->
  <g>
    <rect x="60" y="260" width="240" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="288" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="700">envs/dev</text>
    <text x="180" y="310" text-anchor="middle" fill="#94a3b8" font-size="12">t3.small · 1 AZ</text>
    <text x="180" y="328" text-anchor="middle" fill="#94a3b8" font-size="12">no backups · spot ok</text>
    <text x="180" y="346" text-anchor="middle" fill="#94a3b8" font-size="12">dev.tfvars</text>
    <rect x="90" y="362" width="180" height="30" rx="6" fill="#0c4a6e"/>
    <text x="180" y="381" text-anchor="middle" fill="#e0f2fe" font-size="11" font-family="monospace">dev.tfstate</text>

    <rect x="330" y="260" width="240" height="150" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="450" y="288" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700">envs/staging</text>
    <text x="450" y="310" text-anchor="middle" fill="#94a3b8" font-size="12">m6i.large · 2 AZ</text>
    <text x="450" y="328" text-anchor="middle" fill="#94a3b8" font-size="12">prod-like · 7d backups</text>
    <text x="450" y="346" text-anchor="middle" fill="#94a3b8" font-size="12">staging.tfvars</text>
    <rect x="360" y="362" width="180" height="30" rx="6" fill="#78350f"/>
    <text x="450" y="381" text-anchor="middle" fill="#fef3c7" font-size="11" font-family="monospace">staging.tfstate</text>

    <rect x="600" y="260" width="240" height="150" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="720" y="288" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="700">envs/prod</text>
    <text x="720" y="310" text-anchor="middle" fill="#94a3b8" font-size="12">m6i.large · 3 AZ</text>
    <text x="720" y="328" text-anchor="middle" fill="#94a3b8" font-size="12">multi-AZ · 30d backups</text>
    <text x="720" y="346" text-anchor="middle" fill="#94a3b8" font-size="12">prod.tfvars</text>
    <rect x="630" y="362" width="180" height="30" rx="6" fill="#064e3b"/>
    <text x="720" y="381" text-anchor="middle" fill="#d1fae5" font-size="11" font-family="monospace">prod.tfstate</text>
  </g>

  <!-- Arrows modules -> envs -->
  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="200" y1="222" x2="180" y2="256"/>
    <line x1="450" y1="222" x2="450" y2="256"/>
    <line x1="700" y1="222" x2="720" y2="256"/>
  </g>

  <!-- Remote state -->
  <g>
    <rect x="240" y="450" width="420" height="80" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="450" y="476" text-anchor="middle" fill="#f9a8d4" font-size="14" font-weight="700">Remote State (S3 + DynamoDB locks)</text>
    <text x="450" y="498" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">s3://acme-terraform-state/envs/*.tfstate</text>
    <text x="450" y="516" text-anchor="middle" fill="#94a3b8" font-size="12">one state file per env · apply-time locking</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <line x1="180" y1="412" x2="330" y2="448"/>
    <line x1="450" y1="412" x2="450" y2="448"/>
    <line x1="720" y1="412" x2="570" y2="448"/>
  </g>

  <text x="450" y="552" text-anchor="middle" fill="#64748b" font-size="11">modules hold logic · environments hold configuration · state is remote and locked</text>
</svg>
